openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Maestro API
  version: 0.1.0
  description: |-
    Contract for Maestro's Laravel JSON API. It covers browser identity and CSRF,
    onboarding, authenticated studio discovery, studio invitations, people and
    student lifecycle management, and household aggregate management. First-party
    browser mutations use Sanctum's stateful session together with Laravel's XSRF
    cookie/header pair.
  contact:
    name: Maestro engineering
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Laravel API origin for the current environment
tags:
  - name: Authentication
    description: Sanctum browser bootstrap and headless Fortify identity lifecycle.
  - name: Onboarding
    description: Authenticated workspace onboarding without deriving authorization from UI preferences.
  - name: Studios
    description: Studio discovery and lifecycle entry points for authenticated members.
  - name: Invitations
    description: Public invitation preview and tenant-scoped invitation management and acceptance.
  - name: People
    description: Tenant-scoped people, student/staff profiles, taxonomy assignments, and student lifecycle.
  - name: Households
    description: Tenant-scoped household, learner, guardian, and portal-access management.
security:
  - sanctumSession: []
paths:
  /sanctum/csrf-cookie:
    get:
      tags:
        - Authentication
      summary: Initialize browser CSRF protection
      description: |-
        Starts or resumes the Laravel browser session and sets the readable
        `XSRF-TOKEN` cookie. The client URL-decodes that cookie and returns it in
        `X-XSRF-TOKEN` on every state-changing request. This endpoint does not
        authenticate a user.
      operationId: initializeCsrf
      security: []
      responses:
        '204':
          description: CSRF cookie and browser session initialized; response has no body.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Log in with email and password
      description: |-
        Authenticates a normalized email against the global user identity and rotates
        the Laravel session. Unknown-email and wrong-password attempts use the same
        Laravel validation response. A confirmed-TOTP account returns
        `two_factor: true` after the first factor and remains unauthenticated until the
        session-bound two-factor challenge succeeds.
      operationId: login
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            examples:
              passwordLogin:
                $ref: '#/components/examples/Login'
      responses:
        '200':
          description: Password authentication completed and session rotated.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
              examples:
                authenticated:
                  value:
                    two_factor: false
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a global user
      description: |-
        Accepts a syntactically valid registration request without revealing whether the
        normalized email, account, or invitation exists. New and existing emails receive
        the same generic `202`, response headers, cookie behavior, and no redirect. The
        operation never authenticates the browser, rotates its existing CSRF session, or
        grants studio authority. Only a genuinely new email with no invitation or a valid
        email-bound pending invitation creates an unverified global user and queues an
        encrypted, after-commit verification notification. Existing emails and unusable,
        terminal, or email-mismatched invitation tokens produce the same accepted response
        without mutation or notification. Explicit sign-in plus onboarding or invitation
        acceptance performs any later studio-authority transition. Every semantically
        accepted path performs password-hash work inside a 300 ms minimum timebox. HMACed
        limiter keys allow five requests/hour per normalized email plus IP and 20/hour per
        IP, with the shared auth-form ceiling also applied; raw emails are never limiter keys.
        `422` is reserved for account-independent input syntax, confirmation, length, or
        compromised-password validation and never reports account or invitation semantics.
      operationId: register
      x-acceptance-ids: [IDA-REG-001, REGISTER-E001, REGISTER-E002, REGISTER-E003, REGISTER-E004, REGISTER-E005]
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
            examples:
              invitedUser:
                $ref: '#/components/examples/InvitedRegistration'
              uninvitedUser:
                value:
                  name: Ada Lovelace
                  email: ada@example.com
                  password: Correct-Horse-42!
                  password_confirmation: Correct-Horse-42!
      responses:
        '202':
          description: |-
            Uniform unauthenticated response for every semantically accepted request.
            It does not claim that an account was created or a notification was sent.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAcceptedResult'
              examples:
                generic:
                  $ref: '#/components/examples/RegistrationAccepted'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out the current browser session
      description: Logs out the web guard, invalidates the current session, and regenerates the CSRF token.
      operationId: logout
      security:
        - sanctumSession: []
          csrfToken: []
      responses:
        '204':
          description: Current browser session invalidated; response has no body.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request a password reset link
      description: |-
        Always returns the same success response for a syntactically valid email,
        whether or not an account exists. Email is normalized for lookup. Only a known
        eligible account receives the queued reset notification.
      operationId: requestPasswordReset
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
            examples:
              resetRequest:
                value:
                  email: member@example.com
      responses:
        '202':
          description: Generic anti-enumeration response, independent of account existence.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResult'
              examples:
                generic:
                  value:
                    message: If an account matches that email, a password reset link will be sent.
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset a password
      description: |-
        Consumes a valid Laravel password-broker token, sets a strong confirmed
        uncompromised password, rotates the remember token, removes that user's
        database-backed browser sessions, and revokes that user's Sanctum personal
        access tokens without affecting other users.
      operationId: resetPassword
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordInput'
            examples:
              validReset:
                value:
                  email: member@example.com
                  token: 6f319385ccb4898c2b275bb531db899b
                  password: Even-Stronger-84!
                  password_confirmation: Even-Stronger-84!
      responses:
        '200':
          description: Password reset completed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                reset:
                  value:
                    message: Your password has been reset.
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/email/verification-notification:
    post:
      tags:
        - Authentication
      summary: Resend the verification email
      description: Queues another temporary signed verification link for the current unverified user.
      operationId: resendEmailVerification
      security:
        - sanctumSession: []
          csrfToken: []
      responses:
        '202':
          description: Verification notification accepted for delivery; response has no body.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
        '204':
          description: The current user was already verified; no notification was required and the response has no body.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/email/verify/{id}/{hash}:
    get:
      tags:
        - Authentication
      summary: Consume a signed email-verification link
      description: |-
        Verifies the exact authenticated user's current email through Laravel's
        temporary signed URL. JSON clients receive `204`; browser navigation redirects
        to the configured onboarding URL with `verified=1`.
      operationId: verifyEmail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: hash
          in: path
          required: true
          description: SHA-1 hash of the current verification email.
          schema:
            type: string
            pattern: '^[a-f0-9]{40}$'
        - name: expires
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: signature
          in: query
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
      responses:
        '204':
          description: Email verified, or already verified; response has no body.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
        '302':
          description: Browser navigation redirected to onboarding after verification.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/user:
    get:
      tags:
        - Authentication
      summary: Get the current global user
      description: Returns safe global identity fields only; studio memberships are fetched through the studio collection.
      operationId: getCurrentUser
      responses:
        '200':
          description: Current authenticated global identity.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEnvelope'
              examples:
                verifiedUser:
                  $ref: '#/components/examples/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/user/confirm-password:
    post:
      tags:
        - Authentication
      summary: Confirm the current password
      description: Confirms the authenticated user's password and records Laravel's recent-confirmation timestamp in this session.
      operationId: confirmPassword
      x-acceptance-ids: [IDA-STEPUP-001, ACCOUNT-E004]
      security:
        - sanctumSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPasswordInput'
      responses:
        '201':
          description: Password confirmed; response body is an empty JSON string.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
          content:
            application/json:
              schema:
                type: string
                const: ''
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/user/confirmed-password-status:
    get:
      tags:
        - Authentication
      summary: Read the current password-confirmation status
      description: Returns whether this session's password confirmation remains within the server's configured timeout.
      operationId: getPasswordConfirmationStatus
      x-acceptance-ids: [IDA-STEPUP-001, ACCOUNT-E004]
      responses:
        '200':
          description: Current session password-confirmation status.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordConfirmationStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/two-factor-challenge:
    post:
      tags:
        - Authentication
      summary: Complete a TOTP login challenge
      description: |-
        Completes the session-bound second factor created by a successful password
        login. Exactly one current TOTP `code` or unused `recovery_code` is accepted.
        A recovery code is rotated after successful use.
      operationId: completeTwoFactorChallenge
      x-acceptance-ids: [IDA-MFA-002, AUTH-E008, AUTH-E009, AUTH-E010]
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorChallengeInput'
      responses:
        '204':
          description: Second factor accepted and the authenticated session regenerated; response has no body.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/user/two-factor-authentication:
    post:
      tags:
        - Authentication
      summary: Begin TOTP setup
      description: |-
        Creates an encrypted pending TOTP secret and recovery-code set. TOTP does not
        protect login until the separate confirmation operation accepts a valid code.
        A recent password confirmation is required.
      operationId: enableTwoFactorAuthentication
      x-acceptance-ids: [IDA-MFA-001, MFA-E001]
      security:
        - sanctumSession: []
          csrfToken: []
      responses:
        '200':
          description: Pending TOTP setup created; response body is an empty JSON string.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
          content:
            application/json:
              schema:
                type: string
                const: ''
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '423':
          $ref: '#/components/responses/RecentPasswordRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Authentication
      summary: Disable TOTP
      description: Deletes the encrypted TOTP secret and recovery codes after recent password confirmation.
      operationId: disableTwoFactorAuthentication
      x-acceptance-ids: [IDA-MFA-003, MFA-E004]
      security:
        - sanctumSession: []
          csrfToken: []
      responses:
        '200':
          description: TOTP disabled; response body is an empty JSON string.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
          content:
            application/json:
              schema:
                type: string
                const: ''
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '423':
          $ref: '#/components/responses/RecentPasswordRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/user/two-factor-qr-code:
    get:
      tags:
        - Authentication
      summary: Read the pending TOTP QR code
      description: Returns sensitive setup material only after recent password confirmation.
      operationId: getTwoFactorQrCode
      x-acceptance-ids: [IDA-MFA-001, MFA-E006]
      responses:
        '200':
          description: QR SVG and equivalent OTPAuth URL for the pending TOTP secret.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorQrCodeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/RecentPasswordRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/user/two-factor-secret-key:
    get:
      tags:
        - Authentication
      summary: Read the pending TOTP secret key
      description: Returns the sensitive manual-entry key only after recent password confirmation.
      operationId: getTwoFactorSecretKey
      x-acceptance-ids: [IDA-MFA-001, MFA-E006]
      responses:
        '200':
          description: Manual-entry secret for the pending setup.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorSecretKey'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/RecentPasswordRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/user/confirmed-two-factor-authentication:
    post:
      tags:
        - Authentication
      summary: Confirm pending TOTP setup
      description: Confirms and activates the pending encrypted TOTP secret using a current six-digit code.
      operationId: confirmTwoFactorAuthentication
      x-acceptance-ids: [IDA-MFA-001, MFA-E002]
      security:
        - sanctumSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCodeInput'
      responses:
        '200':
          description: TOTP confirmed; response body is an empty JSON string.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
          content:
            application/json:
              schema:
                type: string
                const: ''
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          $ref: '#/components/responses/RecentPasswordRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/user/two-factor-recovery-codes:
    get:
      tags:
        - Authentication
      summary: Read TOTP recovery codes
      description: Returns the current recovery-code set only after TOTP activation and recent password confirmation.
      operationId: getTwoFactorRecoveryCodes
      x-acceptance-ids: [IDA-MFA-001, MFA-E003]
      responses:
        '200':
          description: Current recovery codes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorRecoveryCodes'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/RecentPasswordRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Authentication
      summary: Regenerate TOTP recovery codes
      description: Replaces every previous recovery code only after TOTP activation and recent password confirmation.
      operationId: regenerateTwoFactorRecoveryCodes
      x-acceptance-ids: [IDA-MFA-001, MFA-E003]
      security:
        - sanctumSession: []
          csrfToken: []
      responses:
        '200':
          description: Recovery codes regenerated; response body is an empty JSON string. Read the replacement set with the separate GET operation.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
          content:
            application/json:
              schema:
                type: string
                const: ''
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '423':
          $ref: '#/components/responses/RecentPasswordRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/passkeys/login/options:
    get:
      tags:
        - Authentication
      summary: Begin usernameless passkey login
      description: Creates single-use WebAuthn request options bound to the current browser session.
      operationId: getPasskeyLoginOptions
      x-acceptance-ids: [IDA-PASSKEY-001, PASS-E001]
      security: []
      responses:
        '200':
          description: Browser WebAuthn request options.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Expires:
              $ref: '#/components/headers/ExpiresImmediately'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptionsEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/passkeys/login:
    post:
      tags:
        - Authentication
