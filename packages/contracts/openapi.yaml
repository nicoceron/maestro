      tags:
        - Invitations
      summary: List studio invitations
      description: |-
        Returns the studio's invitations newest-first in Laravel's fixed 25-item
        paginator. Owners and administrators may list; all records and counts are
        scoped to the route studio. Tokens and token hashes are never serialized.
      operationId: listStudioInvitations
      parameters:
        - $ref: '#/components/parameters/InvitationSearch'
        - $ref: '#/components/parameters/InvitationStatusFilter'
        - $ref: '#/components/parameters/InvitationRoleFilter'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated tenant-scoped invitations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioInvitationPaginatedCollectionEnvelope'
              examples:
                invitations:
                  $ref: '#/components/examples/StudioInvitationCollection'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Invitations
      summary: Invite a studio member
      description: |-
        Normalizes the email and queues a seven-day invitation. The request role is
        limited to administrator, office, billing, or teacher. Owners may invite any
        of those roles; administrators may invite only office, billing, or teacher.
        The route studio, inviter, status, and token are always server-controlled.
        After route binding, active-studio membership authorization, recent password or passkey
        confirmation no older than ten minutes, and mutation role-policy authorization succeed,
        create is limited to 20 attempts/hour per inviter and 100 attempts/day per route studio.
        Rejected non-members, role-denied members, or unconfirmed callers do not consume these
        sensitive quotas; quota rejection returns `429` before invitation, delivery, audit, or job
        effects. The delivery job's invitation-domain payload contains only the invitation ULID
        and delivery version, alongside Laravel's framework queue metadata; bearer material is
        derived only at the delivery boundary and never serialized.
      operationId: createStudioInvitation
      x-acceptance-ids: [IDA-STEPUP-001, IDA-INVITE-001, INV-E001, INV-E002, INV-E018]
      security:
        - sanctumSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudioInvitationInput'
            examples:
              teacher:
                $ref: '#/components/examples/CreateStudioInvitation'
      responses:
        '201':
          description: Invitation created and queued for delivery; provider delivery is not claimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioInvitationCreatedEnvelope'
              examples:
                sent:
                  $ref: '#/components/examples/StudioInvitationCreated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          $ref: '#/components/responses/RecentPasswordRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
