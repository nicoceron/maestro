  responses:
    Unauthenticated:
      description: A valid Sanctum session was not supplied, or its idle/absolute server lifetime expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                message: Unauthenticated.
            expired:
              value:
                message: Your session has expired. Please sign in again.
    Forbidden:
      description: The authenticated user cannot access the requested studio or resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            message: This action is unauthorized.
    EmailNotVerified:
      description: A verified global email is required for verified studio business routes and new-studio onboarding.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            message: Your email address is not verified.
    NotFound:
      description: The requested resource does not exist, is outside the caller's scope, or protected setup material is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            message: Resource not found.
    CsrfTokenMismatch:
      description: The Sanctum CSRF cookie/header pair is absent or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            message: CSRF token mismatch.
    RecentPasswordRequired:
      description: This sensitive operation requires a fresh password or passkey confirmation in the current session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            message: Password confirmation required.
    Conflict:
      description: Session management requires the configured database session driver.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            message: Session management requires the database session driver.
    ValidationFailed:
      description: One or more request fields failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            message: The slug field is invalid.
            errors:
              slug:
                - The selected slug is invalid.
              currency:
                - The currency field must be 3 characters.
    InvitationUnavailable:
      description: The token does not identify a currently pending invitation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            message: Invitation unavailable.
    InvitationCannotBeAccepted:
      description: |-
        The invitation is missing, terminal, expired, bound to a different normalized
        email, or otherwise cannot create an active membership. These states share one
        validation field and message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            message: The invitation token field is invalid.
            errors:
              invitation_token:
                - This invitation cannot be accepted.
    InvitationCannotBeRevoked:
      description: The invitation is accepted, expired, or superseded and cannot be revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            message: The invitation field is invalid.
            errors:
              invitation:
                - This invitation cannot be revoked.
    InvitationCannotBeResent:
      description: The tenant-visible invitation is accepted, revoked, superseded, or still inside its resend cooldown. Expired invitations are renewable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            message: The invitation field is invalid.
            errors:
              invitation:
                - This invitation cannot be resent yet.
    PersonUpdateFailed:
      description: |-
        Input validation, stale optimistic version, unavailable tenant taxonomy, or
        an attempted student-lifecycle bypass prevented the entire update.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            staleVersion:
              value:
                message: The version field is invalid.
                errors:
                  version:
                    - This person changed after you opened it. Refresh and try again.
            lifecycleBypass:
              value:
                message: The student.status field is invalid.
                errors:
                  student.status:
                    - Use the student status transition action to change lifecycle state.
    StudentStatusTransitionFailed:
      description: |-
        Input validation, stale optimistic version, or the server-owned lifecycle graph
        rejected the requested transition. No version or history effect is committed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            staleVersion:
              value:
                message: The version field is invalid.
                errors:
                  version:
                    - This person changed after you opened it. Refresh and try again.
            transitionDenied:
              value:
                message: The status field is invalid.
                errors:
                  status:
                    - A student cannot move from active to trial.
    HouseholdUpdateFailed:
      description: |-
        Input validation, stale aggregate/member version, cross-tenant person identity,
        or an attempted student-lifecycle bypass prevented the complete aggregate update.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            staleAggregate:
              value:
                message: The version field is invalid.
                errors:
                  version:
                    - This household changed after you opened it. Refresh and try again.
            staleMember:
              value:
                message: The members.0.version field is invalid.
                errors:
                  members.0.version:
                    - This person changed after you opened the household.
    TooManyRequests:
      description: API rate limit exceeded.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            message: Too Many Attempts.
  schemas:
    Ulid:
      type: string
      description: Canonical 26-character Crockford Base32 ULID.
      minLength: 26
      maxLength: 26
      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      example: 01KZN5W3P3507MV3FBN2BG5WKF
    NormalizedEmail:
      type: string
      format: email
      minLength: 3
      maxLength: 254
      description: Global identity email after Unicode whitespace trim, NFKC normalization, and Unicode-aware lowercase normalization.
      example: member@example.com
    InvitationToken:
      type: string
      minLength: 40
      maxLength: 128
      pattern: '^[A-Za-z0-9]+$'
      description: Opaque invitation bearer token. Email links carry it in the URL fragment; the browser scrubs the fragment and submits the token only in a JSON request body. It is never returned by an API resource.
    InvitationTokenInput:
      type: object
      additionalProperties: false
      required:
        - invitation_token
      properties:
        invitation_token:
          $ref: '#/components/schemas/InvitationToken'
    StrongPassword:
      type: string
      format: password
      minLength: 12
      writeOnly: true
      description: At least 12 characters. Passphrases are allowed; confirmation equality and Laravel's uncompromised-password check are enforced server-side without character-composition rules.
    LoginInput:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          $ref: '#/components/schemas/NormalizedEmail'
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
        remember:
          type: boolean
          default: false
    LoginResult:
      type: object
      additionalProperties: false
      required:
        - two_factor
      properties:
        two_factor:
          type: boolean
          description: |-
            `true` means the first factor succeeded but the browser must complete the
            session-bound TOTP challenge before it is authenticated.
    RegisterInput:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - password
        - password_confirmation
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          $ref: '#/components/schemas/NormalizedEmail'
        password:
          $ref: '#/components/schemas/StrongPassword'
        password_confirmation:
          allOf:
            - $ref: '#/components/schemas/StrongPassword'
          description: Must exactly match `password`.
        invitation_token:
          description: Optional bearer considered during account creation. Unusable or email-mismatched tokens receive the generic accepted response and create nothing; registration never verifies the user, consumes the invitation, or creates a membership.
          anyOf:
            - $ref: '#/components/schemas/InvitationToken'
            - type: 'null'
    EmailInput:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          $ref: '#/components/schemas/NormalizedEmail'
    ResetPasswordInput:
      type: object
      additionalProperties: false
      required:
        - email
        - token
        - password
        - password_confirmation
      properties:
        email:
          $ref: '#/components/schemas/NormalizedEmail'
        token:
          type: string
          minLength: 1
          writeOnly: true
          description: Single-use Laravel password-broker token received in a URL fragment, scrubbed by the browser, and submitted only in this JSON body.
        password:
          $ref: '#/components/schemas/StrongPassword'
        password_confirmation:
          allOf:
            - $ref: '#/components/schemas/StrongPassword'
          description: Must exactly match `password`.
    Message:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
    ConfirmPasswordInput:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
    PasswordConfirmationStatus:
      type: object
      additionalProperties: false
      required:
        - confirmed
      properties:
        confirmed:
          type: boolean
    TwoFactorCode:
      type: string
      pattern: '^[0-9]{6}$'
      minLength: 6
      maxLength: 6
      writeOnly: true
      description: Current six-digit TOTP code; never log or persist the submitted value.
    TwoFactorCodeInput:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          $ref: '#/components/schemas/TwoFactorCode'
    TwoFactorChallengeInput:
      type: object
      additionalProperties: false
      oneOf:
        - title: TOTP challenge
          required:
            - code
          not:
            properties:
              recovery_code: {}
            required:
              - recovery_code
        - title: Recovery-code challenge
          required:
            - recovery_code
          not:
            properties:
              code: {}
            required:
              - code
      properties:
        code:
          $ref: '#/components/schemas/TwoFactorCode'
        recovery_code:
          type: string
          minLength: 1
          maxLength: 64
          writeOnly: true
          description: Single-use TOTP recovery code.
    TwoFactorQrCode:
      type: object
      additionalProperties: false
      required:
        - svg
        - url
      properties:
        svg:
          type: string
          minLength: 1
          description: SVG QR markup containing the pending OTPAuth setup URI; treat as secret setup material.
        url:
          type: string
          minLength: 1
          pattern: '^otpauth://totp/'
          description: Pending OTPAuth setup URI.
    TwoFactorQrCodeResponse:
      description: Fortify returns an empty JSON array when no pending TOTP secret exists.
      oneOf:
        - $ref: '#/components/schemas/TwoFactorQrCode'
        - type: array
          maxItems: 0
    TwoFactorSecretKey:
      type: object
      additionalProperties: false
      required:
        - secretKey
      properties:
        secretKey:
          type: string
          minLength: 16
          description: Decrypted manual-entry TOTP secret returned only during recently confirmed setup.
    TwoFactorRecoveryCodes:
      type: array
      minItems: 1
      uniqueItems: true
      description: Raw nonempty Fortify recovery-code array returned only after TOTP activation and recent confirmation.
      items:
        type: string
        minLength: 1
        maxLength: 64
    WebAuthnCredential:
      type: object
      additionalProperties: true
      required:
        - id
        - rawId
        - type
        - response
      properties:
        id:
          type: string
          minLength: 1
        rawId:
          type: string
          minLength: 1
          description: Base64url-encoded credential ID produced by the browser ceremony.
        type:
          type: string
          const: public-key
        response:
          type: object
          additionalProperties: true
          description: Browser WebAuthn authenticator response; its exact members depend on the ceremony.
        clientExtensionResults:
          type: object
          additionalProperties: true
    WebAuthnOptionsEnvelope:
      type: object
      additionalProperties: false
      required:
        - options
      properties:
        options:
          type: object
          additionalProperties: true
          description: Session-bound WebAuthn PublicKeyCredential request or creation options for `navigator.credentials`.
    PasskeyVerificationInput:
      type: object
      additionalProperties: false
      required:
        - credential
      properties:
        credential:
          $ref: '#/components/schemas/WebAuthnCredential'
        remember:
          type: boolean
          default: false
    PasskeyRegistrationInput:
      type: object
      additionalProperties: false
      required:
        - name
        - credential
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: User-visible label for this authenticator; control characters are rejected.
        credential:
          $ref: '#/components/schemas/WebAuthnCredential'
    PasskeyRedirectResult:
      type: object
      additionalProperties: false
      required:
        - redirect
      properties:
        redirect:
          type: string
          format: uri-reference
    PasskeyRegistrationResult:
      type: object
      additionalProperties: false
      required:
        - status
        - id
        - name
      properties:
        status:
          type: string
          const: passkey-registered
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 80
    PasskeyDeletedResult:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: passkey-deleted
    Passkey:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - authenticator
        - last_used_at
        - created_at
      properties:
        id:
          type: string
          pattern: '^[1-9][0-9]*$'
        name:
          type: string
          minLength: 1
          maxLength: 80
        authenticator:
          type:
            - string
            - 'null'
          description: Safe best-effort authenticator label derived from the AAGUID.
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    PasskeyCollectionEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Passkey'
    BrowserSession:
      type: object
      additionalProperties: false
      required:
        - id
        - device
        - approximate_location
        - created_at
        - last_seen_at
        - current
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        device:
          type: string
          minLength: 1
          maxLength: 64
          description: Server-derived, display-only browser and platform label; not a trusted device identity.
        approximate_location:
          type:
            - string
            - 'null'
          maxLength: 64
          description: Coarsened network prefix for display, never the full observed source address.
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        current:
          type: boolean
    SessionCollectionEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BrowserSession'
    RegistrationAcceptedResult:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          const: If registration can be completed, check your email for next steps.
          description: Generic guidance that does not claim an account or notification exists.
    ForgotPasswordResult:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          const: If an account matches that email, a password reset link will be sent.
    CurrentUser:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - email_verified_at
        - two_factor_enabled
        - passkeys_count
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
