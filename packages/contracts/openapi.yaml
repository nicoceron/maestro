    CreateHouseholdMemberInput:
      type: object
      additionalProperties: false
      description: |-
        A request-local `key` links guardian relationships before persistent ULIDs exist.
        Exactly one member in the aggregate must be the primary contact, and that member
        must have an email address or phone number. Learners require a student profile;
        non-learners cannot have one.
      required:
        - key
        - first_name
        - household_role
        - is_primary_contact
        - receives_billing
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[a-z0-9][a-z0-9-]*$'
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type:
            - string
            - 'null'
          maxLength: 100
        preferred_name:
          type:
            - string
            - 'null'
          maxLength: 100
        email:
          anyOf:
            - type: string
              format: email
              maxLength: 254
            - type: 'null'
        phone:
          type:
            - string
            - 'null'
          maxLength: 40
        birth_date:
          type:
            - string
            - 'null'
          format: date
          description: Must not be later than the request date.
        pronouns:
          type:
            - string
            - 'null'
          maxLength: 60
        household_role:
          $ref: '#/components/schemas/HouseholdMemberRole'
        is_primary_contact:
          type: boolean
        receives_billing:
          type: boolean
        student:
          anyOf:
            - $ref: '#/components/schemas/CreateStudentProfileInput'
            - type: 'null'
    UpdateHouseholdMemberInput:
      type: object
      additionalProperties: false
      description: |-
        A retained studio person supplies both `person_id` and its current `version`;
        a new person omits both. `key` remains request-local for guardian relationships.
      required:
        - key
        - first_name
        - household_role
        - is_primary_contact
        - receives_billing
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[a-z0-9][a-z0-9-]*$'
        person_id:
          description: Omit for a new person; a retained person must include its current `version`.
          anyOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        version:
          type: integer
          minimum: 1
          description: Required when `person_id` identifies a retained person.
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type:
            - string
            - 'null'
          maxLength: 100
        preferred_name:
          type:
            - string
            - 'null'
          maxLength: 100
        email:
          anyOf:
            - type: string
              format: email
              maxLength: 254
            - type: 'null'
        phone:
          type:
            - string
            - 'null'
          maxLength: 40
        birth_date:
          type:
            - string
            - 'null'
          format: date
          description: Must not be later than the request date.
        pronouns:
          type:
            - string
            - 'null'
          maxLength: 60
        household_role:
          $ref: '#/components/schemas/HouseholdMemberRole'
        is_primary_contact:
          type: boolean
        receives_billing:
          type: boolean
        student:
          description: |-
            A new profile requires `status`. An existing profile may retain its current
            status but cannot be removed or transitioned through this aggregate update.
          anyOf:
            - $ref: '#/components/schemas/CreateStudentProfileInput'
            - type: 'null'
    CreateGuardianRelationshipInput:
      type: object
      additionalProperties: false
      description: |-
        Keys must reference a guardian member and a learner member in the same request.
