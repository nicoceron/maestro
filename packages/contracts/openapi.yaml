    parameters:
      - $ref: '#/components/parameters/StudioSlug'
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags:
        - Invitations
      summary: Queue a replacement invitation
      description: |-
        Atomically supersedes a pending or expired route-studio invitation with a new
        invitation ULID, incremented internal delivery version, fresh seven-day expiry, and fresh
        derived bearer digest. The old bearer is invalid before this operation returns.
        Accepted, revoked, already-superseded, and cooldown-bound invitations return the
        same tenant-local `422` field error. The replacement keeps the locked email, role,
        studio, and internal lineage. Delivery is queued by invitation ULID and version only and
        the response does not claim provider delivery. A password or passkey confirmation
        no older than ten minutes is required.
      operationId: resendStudioInvitation
      x-acceptance-ids: [IDA-STEPUP-001, IDA-INVITE-001, INV-E005, INV-E008, INV-E018, JOB-001, JOB-002]
      security:
        - sanctumSession: []
          csrfToken: []
      responses:
        '202':
          description: Fresh replacement invitation created and queued; the superseded bearer is unusable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioInvitationResentEnvelope'
              examples:
                queued:
                  $ref: '#/components/examples/StudioInvitationResent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/InvitationCannotBeResent'
        '423':
          $ref: '#/components/responses/RecentPasswordRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/studios/{studio}/invitations/{invitation}:
    parameters:
      - $ref: '#/components/parameters/StudioSlug'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags:
        - Invitations
      summary: Revoke a studio invitation
      description: |-
        Revokes a pending invitation in the route studio and treats an already-revoked
        invitation as idempotent success. Accepted, expired, and superseded invitations
        return the same tenant-local `422` field error. Owners
        may revoke invitations for any implemented management role; administrators
        may revoke only office, billing, and teacher invitations. A password or
        passkey confirmation no older than ten minutes is required.
      operationId: revokeStudioInvitation
      x-acceptance-ids: [IDA-STEPUP-001, IDA-INVITE-001, INV-E006]
      security:
        - sanctumSession: []
          csrfToken: []
      responses:
        '204':
          description: Pending invitation revoked or already-revoked invitation left unchanged; response has no body.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/InvitationCannotBeRevoked'
        '423':
          $ref: '#/components/responses/RecentPasswordRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/studios/{studio}/people:
    parameters:
      - $ref: '#/components/parameters/StudioSlug'
    get:
      tags:
        - People
      summary: List people in a studio
      description: |-
        Returns a tenant-scoped, deterministic Laravel paginator ordered by last name,
        first name, and ULID. Owners, administrators, office staff, and billing staff
        may list; teachers may not. Billing responses retain names, person-record status,
        and payer contact information while privacy-restricted fields become `null`,
        private collections become empty arrays, and staff profiles become `null`.
        Billing callers may use `q`, `status`, and pagination; a syntactically valid
        student, staff, taxonomy, or source filter returns `403` because those fields
        are private (ordinary parameter validation can return `422` first).
        Taxonomy IDs from another studio cannot broaden the query and produce an empty
        tenant-local result.
      operationId: listPeople
      parameters:
        - $ref: '#/components/parameters/PeopleSearch'
        - $ref: '#/components/parameters/PersonStatusFilter'
        - $ref: '#/components/parameters/StudentStatusFilter'
        - $ref: '#/components/parameters/StaffRoleFilter'
        - $ref: '#/components/parameters/InstrumentIdFilter'
        - $ref: '#/components/parameters/TagIdFilter'
        - $ref: '#/components/parameters/PersonSourceFilter'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated people visible under the current membership's privacy policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPaginatedCollectionEnvelope'
              examples:
                people:
                  $ref: '#/components/examples/PeopleCollection'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - People
      summary: Create a person and optional profiles
      description: |-
        Atomically creates a tenant-owned person plus optional student/staff profiles,
        active studio tags and instruments, and definition-typed custom-field values.
        Owners, administrators, and office staff may create; billing staff and teachers
        may not. Taxonomy and custom-field identifiers must resolve inside the route
        studio or the entire request fails with `422` and no partial person.
      operationId: createPerson
      security:
        - sanctumSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonInput'
            examples:
              student:
                $ref: '#/components/examples/CreatePerson'
      responses:
        '201':
          description: Person and submitted profiles/assignments created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonCreatedEnvelope'
              examples:
                created:
                  $ref: '#/components/examples/PersonCreated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/studios/{studio}/people/{person}:
    parameters:
      - $ref: '#/components/parameters/StudioSlug'
      - $ref: '#/components/parameters/PersonId'
    get:
      tags:
        - People
      summary: Get a person
      description: |-
        Resolves the person only through the route studio, so a cross-tenant ULID is
        indistinguishable from a missing record and returns `404`. Owners,
        administrators, office staff, and billing staff may view. The same
        membership-sensitive privacy substitutions as the collection apply; detail
        responses include up to 100 newest-first immutable student status transitions
        for management roles and an empty history for billing.
      operationId: getPerson
      responses:
        '200':
          description: Person visible under the current membership's privacy policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonEnvelope'
              examples:
                person:
                  $ref: '#/components/examples/PersonDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - People
      summary: Update a person and profiles
      description: |-
        Atomically updates the person and supplied profile/assignment collections for
        owners, administrators, and office staff. `version` is required optimistic
        concurrency state; a stale value returns a field-keyed `422` without mutation.
        Student lifecycle status cannot be changed through this operation: clients use
        the dedicated transition operation. Omitting a field preserves it, submitted
        assignment arrays replace that collection, and existing student or staff
        profiles cannot be deleted: lifecycle history is retained by transitioning the
        student or setting staff status to `former`. An inactive tag or instrument that
        is already assigned may be preserved, but it cannot be newly assigned.
      operationId: updatePerson
      security:
        - sanctumSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonInput'
            examples:
              update:
                $ref: '#/components/examples/UpdatePerson'
      responses:
        '200':
          description: Person updated and version incremented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonEnvelope'
              examples:
                updated:
                  $ref: '#/components/examples/PersonDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/PersonUpdateFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/studios/{studio}/people/{person}/student-status:
    parameters:
      - $ref: '#/components/parameters/StudioSlug'
      - $ref: '#/components/parameters/PersonId'
    post:
      tags:
        - People
      summary: Transition a student's lifecycle status
      description: |-
        Moves an existing student profile through the server-owned transition graph,
        records an immutable tenant-scoped history row, updates lifecycle dates, and
        increments the parent person's optimistic version in one transaction. Owners,
        administrators, and office staff may transition. Missing, cross-tenant, and
        non-student people return `404`; disallowed or same-state transitions return a
        field-keyed `422` without history or version effects.
      operationId: transitionStudentStatus
      security:
        - sanctumSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionStudentStatusInput'
            examples:
              trial:
                $ref: '#/components/examples/TransitionStudentStatus'
      responses:
        '200':
          description: Student lifecycle transitioned and immutable history appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonEnvelope'
              examples:
                transitioned:
                  $ref: '#/components/examples/PersonDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/StudentStatusTransitionFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/studios/{studio}/households:
    parameters:
      - $ref: '#/components/parameters/StudioSlug'
    get:
      tags:
        - Households
      summary: List households in a studio
      description: |-
        Returns a name-sorted, tenant-scoped Laravel paginator. The optional search
        matches case-insensitively against household names and member display names.
        Owners, administrators, office staff, and billing staff may list households;
        teachers may not. Billing responses expose contact details only for members
        marked to receive billing and redact private profile and guardian-access data.
      operationId: listHouseholds
      parameters:
        - $ref: '#/components/parameters/HouseholdSearch'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated household aggregates ordered by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdPaginatedCollectionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Households
      summary: Create a household aggregate
      description: |-
        Atomically creates a household, its people and memberships, learner profiles,
        and guardian-to-learner relationships. Owners, administrators, and office staff
        may create households. Billing staff and teachers may not.
      operationId: createHousehold
      security:
        - sanctumSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHouseholdInput'
            examples:
              guardianAndLearner:
                $ref: '#/components/examples/CreateHousehold'
      responses:
        '201':
          description: Household aggregate created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdCreatedEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/studios/{studio}/households/{household}:
    parameters:
      - $ref: '#/components/parameters/StudioSlug'
      - $ref: '#/components/parameters/HouseholdId'
    get:
      tags:
        - Households
      summary: Get a household aggregate
      description: |-
        Returns a household only within the active studio tenant. Cross-studio household
        IDs are intentionally indistinguishable from missing records and return `404`.
        Owners, administrators, office staff, and billing staff may view households.
        Billing responses expose contact details only for members marked to receive
        billing and redact private profile and guardian-access data.
      operationId: getHousehold
      responses:
        '200':
          description: Household aggregate visible to the current studio member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Households
      summary: Update a household aggregate
      description: |-
        Optimistically updates household fields for owners, administrators, and office
        staff. `version` is always required. Omitting `members` preserves the complete
        member and guardian graph; supplying `members` replaces household membership,
        and supplied or omitted `relationships` then replace that graph (omission means
        no relationships). Existing people are referenced with their tenant-scoped
        `person_id` and current `version`; new members omit both. Removed members remain
        people in the studio. Existing student profiles cannot be removed and lifecycle
        status changes use the dedicated person transition operation. Any stale,
        cross-tenant, or invalid nested state returns `422` without partial mutation.
      operationId: updateHousehold
      security:
        - sanctumSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHouseholdInput'
            example:
              version: 1
              name: Rivera family
      responses:
        '200':
          description: Household graph updated and aggregate version incremented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/HouseholdUpdateFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: laravel_session
      description: |-
        Laravel Sanctum stateful browser session. The deployed cookie name may be
        overridden by `SESSION_COOKIE`; browsers send it automatically with credentialed requests.
    csrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: URL-decoded value of Sanctum's `XSRF-TOKEN` cookie for mutating requests.
  parameters:
    StudioSlug:
      name: studio
      in: path
      required: true
      description: Unique studio slug used by Laravel route-model binding.
      schema:
        $ref: '#/components/schemas/StudioSlug'
      example: sonora-house
    HouseholdId:
      name: household
      in: path
      required: true
      description: Household ULID resolved inside the active studio tenant.
      schema:
        $ref: '#/components/schemas/Ulid'
      example: 01KZN6AKC49V3YM8ZJ7T2R5QWD
    PersonId:
      name: person
      in: path
      required: true
      description: Person ULID resolved through the route studio before policy evaluation.
      schema:
        $ref: '#/components/schemas/Ulid'
      example: 01KZN8Y3A48GKXQTE6MHN7R2VC
    InvitationId:
      name: invitation
      in: path
      required: true
      description: Studio invitation ULID, constrained to the route studio before policy evaluation.
      schema:
        $ref: '#/components/schemas/Ulid'
    InvitationSearch:
      name: q
      in: query
      required: false
      description: Normalized, case-insensitive substring search of tenant-visible invitation email addresses.
      schema:
        type: string
        maxLength: 100
      example: teacher@example.com
    InvitationStatusFilter:
      name: status
      in: query
      required: false
      description: Return only invitations in this server-derived lifecycle state.
      schema:
        $ref: '#/components/schemas/InvitationStatus'
    InvitationRoleFilter:
      name: role
      in: query
      required: false
      description: Return only invitations for this locked studio membership role.
      schema:
        $ref: '#/components/schemas/InvitableMembershipRole'
    PasskeyId:
      name: passkey
      in: path
      required: true
      description: Laravel passkey database identifier; ownership is checked against the current user.
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
    SessionId:
      name: userSession
      in: path
      required: true
      description: Opaque public identifier for a browser session; it is not the session cookie value or storage key.
      schema:
        $ref: '#/components/schemas/Ulid'
      example: 01KZN7C5V3EVQW9G2FN8X6MP4R
    HouseholdSearch:
      name: q
      in: query
      required: false
      description: Case-insensitive household-name or member-name search. Blank input is ignored.
      schema:
        type:
          - string
          - 'null'
        maxLength: 100
      example: rivera
    PeopleSearch:
      name: q
      in: query
      required: false
      description: |-
        Case-insensitive substring search across tenant-visible names, email, and phone.
        Blank input is ignored; billing contact matching is restricted to payer-visible contacts.
      schema:
        type:
          - string
          - 'null'
        maxLength: 100
      example: maya
    PersonStatusFilter:
      name: status
      in: query
      required: false
      description: Return only people in this person-record status.
      schema:
        $ref: '#/components/schemas/PersonStatus'
    StudentStatusFilter:
      name: student_status
      in: query
      required: false
      description: Return only people whose student profile has this lifecycle status. Forbidden for billing callers.
      schema:
        $ref: '#/components/schemas/StudentStatus'
    StaffRoleFilter:
      name: staff_role
      in: query
      required: false
      description: Return only people whose staff profile includes this role. Forbidden for billing callers.
      schema:
        $ref: '#/components/schemas/StaffRole'
    InstrumentIdFilter:
      name: instrument_id
      in: query
      required: false
      description: Tenant-owned instrument ULID; a foreign or unavailable ID matches no people. Forbidden for billing callers.
      schema:
        $ref: '#/components/schemas/Ulid'
    TagIdFilter:
      name: tag_id
      in: query
      required: false
      description: Tenant-owned tag ULID; a foreign or unavailable ID matches no people. Forbidden for billing callers.
      schema:
        $ref: '#/components/schemas/Ulid'
    PersonSourceFilter:
      name: source
      in: query
      required: false
      description: Exact normalized source filter. Supplying `null` matches records whose source is null. Forbidden for billing callers.
      schema:
        type:
          - string
          - 'null'
        maxLength: 80
      example: website
    PerPage:
      name: per_page
      in: query
      required: false
      description: Number of records per page. Defaults to `25`.
      schema:
        type:
          - integer
          - 'null'
        minimum: 1
        maximum: 100
        default: 25
      example: 25
    Page:
      name: page
      in: query
      required: false
      description: One-based Laravel paginator page number.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
  headers:
    SetCookie:
      description: |-
        One or more `Set-Cookie` header fields initializing `XSRF-TOKEN` and the
        Laravel session. User agents preserve separate header fields even though
        OpenAPI represents the header value as a string.
      schema:
        type: string
    RateLimitLimit:
      description: Maximum requests allowed in the current rate-limit window.
      schema:
        type: integer
        minimum: 0
    RateLimitRemaining:
      description: Requests remaining in the current rate-limit window.
      schema:
        type: integer
        minimum: 0
    RetryAfter:
      description: Seconds until another request may be attempted.
      schema:
        type: integer
        minimum: 0
    NoStore:
      description: Sensitive identity material must not be stored by a browser or intermediary cache.
      schema:
        type: string
        const: no-store, private
    PragmaNoCache:
      description: Compatibility directive preventing storage of sensitive identity material.
      schema:
        type: string
        const: no-cache
    ExpiresImmediately:
      description: Compatibility directive marking sensitive identity material immediately stale.
      schema:
        type: string
        const: '0'
  examples:
    Login:
      summary: Normalized global identity login
      value:
        email: member@example.com
        password: Correct-Horse-42!
