openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Maestro API
  version: 0.1.0
  description: |-
    Contract for Maestro's versioned Laravel JSON API. The initial surface covers
    authenticated studio discovery and household aggregate management.
  contact:
    name: Maestro engineering
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Laravel API origin for the current environment
tags:
  - name: Studios
    description: Studio discovery and lifecycle entry points for authenticated members.
  - name: Households
    description: Tenant-scoped household, learner, guardian, and portal-access management.
security:
  - sanctumSession: []
paths:
  /api/v1/studios:
    get:
      tags:
        - Studios
      summary: List the current member's studios
      description: |-
        Returns studios for which the authenticated user has an active membership,
        ordered by studio name. The implemented endpoint is not paginated and therefore
        returns only Laravel's `data` collection envelope.
      operationId: listStudios
      responses:
        '200':
          description: Active studio memberships ordered by studio name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioCollectionEnvelope'
              examples:
                memberships:
                  summary: Owner and teacher memberships
                  value:
                    data:
                      - id: 01KZN5W3P3507MV3FBN2BG5WKF
                        name: Aria Academy
                        slug: aria-academy
                        status: trial
                        timezone: America/Bogota
                        locale: es
                        currency: COP
                        week_starts_on: 1
                        trial_ends_at: '2026-09-09T06:15:00+00:00'
                        membership:
                          role: owner
                          status: active
                        permissions:
                          manage: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Studios
      summary: Create a studio
      description: |-
        Creates a trial studio and an active owner membership for the authenticated user.
        Defaults are UTC, English, USD, Monday as the first weekday, and a 30-day trial.
        Currency input is normalized to uppercase. When omitted, the slug is generated
        from the name with a collision-safe numeric suffix.
      operationId: createStudio
      security:
        - sanctumSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudioInput'
            examples:
              localizedStudio:
                summary: Colombian studio
                value:
                  name: Sonora House
                  timezone: America/Bogota
                  locale: es
                  currency: cop
                  week_starts_on: 1
      responses:
        '201':
          description: Studio created and owner membership assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioCreatedEnvelope'
              examples:
                created:
                  value:
                    data:
                      id: 01KZN5W3P3507MV3FBN2BG5WKF
                      name: Sonora House
                      slug: sonora-house
                      status: trial
                      timezone: America/Bogota
                      locale: es
                      currency: COP
                      week_starts_on: 1
                      trial_ends_at: '2026-09-09T06:15:00+00:00'
                      membership:
                        role: owner
                        status: active
                      permissions:
                        manage: true
                    message: Studio created.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/studios/{studio}:
    parameters:
      - $ref: '#/components/parameters/StudioSlug'
    get:
      tags:
        - Studios
      summary: Get a studio
      description: |-
        Returns a studio by slug when the authenticated user has an active membership.
        The response includes that user's membership and derived management permission.
      operationId: getStudio
      responses:
        '200':
          description: Studio visible to the current member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/studios/{studio}/households:
    parameters:
      - $ref: '#/components/parameters/StudioSlug'
    get:
      tags:
        - Households
      summary: List households in a studio
      description: |-
        Returns a name-sorted, tenant-scoped Laravel paginator. The optional search
        matches case-insensitively against household names and member display names.
        Owners, administrators, office staff, and billing staff may list households;
        teachers may not. Billing responses expose contact details only for members
        marked to receive billing and redact private profile and guardian-access data.
      operationId: listHouseholds
      parameters:
        - $ref: '#/components/parameters/HouseholdSearch'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated household aggregates ordered by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdPaginatedCollectionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Households
      summary: Create a household aggregate
      description: |-
        Atomically creates a household, its people and memberships, learner profiles,
        and guardian-to-learner relationships. Owners, administrators, and office staff
        may create households. Billing staff and teachers may not.
      operationId: createHousehold
      security:
        - sanctumSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHouseholdInput'
            examples:
              guardianAndLearner:
                $ref: '#/components/examples/CreateHousehold'
      responses:
        '201':
          description: Household aggregate created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdCreatedEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/studios/{studio}/households/{household}:
    parameters:
      - $ref: '#/components/parameters/StudioSlug'
      - $ref: '#/components/parameters/HouseholdId'
    get:
      tags:
        - Households
      summary: Get a household aggregate
      description: |-
        Returns a household only within the active studio tenant. Cross-studio household
        IDs are intentionally indistinguishable from missing records and return `404`.
        Owners, administrators, office staff, and billing staff may view households.
        Billing responses expose contact details only for members marked to receive
        billing and redact private profile and guardian-access data.
      operationId: getHousehold
      responses:
        '200':
          description: Household aggregate visible to the current studio member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: laravel_session
      description: |-
        Laravel Sanctum stateful browser session. The deployed cookie name may be
        overridden by `SESSION_COOKIE`; browsers send it automatically with credentialed requests.
    csrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: URL-decoded value of Sanctum's `XSRF-TOKEN` cookie for mutating requests.
  parameters:
    StudioSlug:
      name: studio
      in: path
      required: true
      description: Unique studio slug used by Laravel route-model binding.
      schema:
        $ref: '#/components/schemas/StudioSlug'
      example: sonora-house
    HouseholdId:
      name: household
      in: path
      required: true
      description: Household ULID resolved inside the active studio tenant.
      schema:
        $ref: '#/components/schemas/Ulid'
      example: 01KZN6AKC49V3YM8ZJ7T2R5QWD
    HouseholdSearch:
      name: q
      in: query
      required: false
      description: Case-insensitive household-name or member-name search. Blank input is ignored.
      schema:
        type:
          - string
          - 'null'
        maxLength: 100
      example: rivera
    PerPage:
      name: per_page
      in: query
      required: false
      description: Number of households per page. Defaults to `25`.
      schema:
        type:
          - integer
          - 'null'
        minimum: 1
        maximum: 100
        default: 25
      example: 25
    Page:
      name: page
      in: query
      required: false
      description: One-based Laravel paginator page number.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
  headers:
    RateLimitLimit:
      description: Maximum requests allowed in the current rate-limit window.
      schema:
        type: integer
        minimum: 0
    RateLimitRemaining:
      description: Requests remaining in the current rate-limit window.
      schema:
        type: integer
        minimum: 0
    RetryAfter:
      description: Seconds until another request may be attempted.
      schema:
        type: integer
        minimum: 0
  examples:
    CreateHousehold:
      summary: Guardian and learner household
      value:
        name: Rivera household
        members:
          - key: sofia
            first_name: Sofía
            last_name: Rivera
            email: sofia@example.test
            phone: '+57 300 555 0101'
            household_role: guardian
            is_primary_contact: true
            receives_billing: true
          - key: lucia
            first_name: Lucía
            last_name: Rivera
            birth_date: '2015-04-12'
            household_role: learner
            is_primary_contact: false
            receives_billing: false
            student:
              status: trial
              joined_on: '2026-08-10'
              school_grade: '5'
        relationships:
          - guardian_key: sofia
            student_key: lucia
            relationship: parent
            is_legal_guardian: true
            is_emergency_contact: true
            is_authorized_pickup: true
            portal_permissions:
              - calendar
              - attendance
              - learning
              - billing
  responses:
    Unauthenticated:
      description: A valid Sanctum session was not supplied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            message: Unauthenticated.
    Forbidden:
      description: The authenticated user cannot access the requested studio or resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            message: This action is unauthorized.
    NotFound:
      description: The requested studio or tenant-scoped resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            message: Resource not found.
    CsrfTokenMismatch:
      description: The Sanctum CSRF cookie/header pair is absent or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            message: CSRF token mismatch.
    ValidationFailed:
      description: One or more request fields failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            message: The slug field is invalid.
            errors:
              slug:
                - The selected slug is invalid.
              currency:
                - The currency field must be 3 characters.
    TooManyRequests:
      description: API rate limit exceeded.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            message: Too Many Attempts.
  schemas:
    Ulid:
      type: string
      description: Canonical 26-character Crockford Base32 ULID.
      minLength: 26
      maxLength: 26
      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      example: 01KZN5W3P3507MV3FBN2BG5WKF
    StudioSlug:
      type: string
      description: ASCII alpha-dash studio slug, unique across studios.
      minLength: 1
      maxLength: 140
      pattern: '^[A-Za-z0-9_-]+$'
      not:
        enum:
          - admin
          - api
          - app
          - login
          - manage
          - platform
          - settings
          - support
          - www
      example: sonora-house
    StudioStatus:
      type: string
      enum:
        - trial
        - active
        - past_due
        - suspended
        - closed
    MembershipRole:
      type: string
      enum:
        - owner
        - administrator
        - office
        - billing
        - teacher
    MembershipStatus:
      type: string
      enum:
        - invited
        - active
        - suspended
    HouseholdMemberRole:
      type: string
      enum:
        - guardian
        - learner
        - other
    PersonStatus:
      type: string
      enum:
        - active
        - inactive
        - archived
    StudentStatus:
      type: string
      enum:
        - lead
        - trial
        - waiting
        - active
        - paused
        - former
    GuardianRelationshipType:
      type: string
      enum:
        - parent
        - legal_guardian
        - grandparent
        - carer
        - other
    PortalPermission:
      type: string
      enum:
        - calendar
        - attendance
        - learning
        - billing
        - booking
        - messages
    Locale:
      type: string
      enum:
        - de
        - en
        - es
        - fr
        - ja
        - nl
    StudioMembership:
      type: object
      additionalProperties: false
      required:
        - role
        - status
      properties:
        role:
          $ref: '#/components/schemas/MembershipRole'
        status:
          $ref: '#/components/schemas/MembershipStatus'
    StudioPermissions:
      type: object
      additionalProperties: false
      required:
        - manage
      properties:
        manage:
          type: boolean
          description: Whether the current member may update this studio.
    Studio:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - status
        - timezone
        - locale
        - currency
        - week_starts_on
        - trial_ends_at
        - membership
        - permissions
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          $ref: '#/components/schemas/StudioSlug'
        status:
          $ref: '#/components/schemas/StudioStatus'
        timezone:
          type: string
          minLength: 1
          description: PHP/IANA timezone identifier.
          example: America/Bogota
        locale:
          $ref: '#/components/schemas/Locale'
        currency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          example: COP
        week_starts_on:
          type: integer
          minimum: 0
          maximum: 6
          description: Weekday index from Sunday (`0`) through Saturday (`6`).
          example: 1
        trial_ends_at:
          type:
            - string
            - 'null'
          format: date-time
        membership:
          $ref: '#/components/schemas/StudioMembership'
        permissions:
          $ref: '#/components/schemas/StudioPermissions'
    CreateStudioInput:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          description: Optional custom slug. Null triggers collision-safe generation from the name.
          anyOf:
            - $ref: '#/components/schemas/StudioSlug'
            - type: 'null'
        timezone:
          type: string
          minLength: 1
          description: PHP/IANA timezone identifier. Defaults to `UTC`.
          example: America/Bogota
        locale:
          allOf:
            - $ref: '#/components/schemas/Locale'
          default: en
        currency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Za-z]{3}$'
          default: USD
          description: ISO 4217 currency code; normalized to uppercase.
        week_starts_on:
          type: integer
          minimum: 0
          maximum: 6
          default: 1
          description: Weekday index from Sunday (`0`) through Saturday (`6`).
    StudioEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Studio'
    StudioCreatedEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - message
      properties:
        data:
          $ref: '#/components/schemas/Studio'
        message:
          type: string
          const: Studio created.
    StudioCollectionEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Studio'
    HouseholdStudentProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - joined_on
        - left_on
        - school_grade
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        status:
          $ref: '#/components/schemas/StudentStatus'
        joined_on:
          type:
            - string
            - 'null'
          format: date
        left_on:
          type:
            - string
            - 'null'
          format: date
        school_grade:
          type:
            - string
            - 'null'
          maxLength: 60
    HouseholdPerson:
      type: object
      additionalProperties: false
      required:
        - id
        - first_name
        - last_name
        - preferred_name
        - display_name
        - email
        - phone
        - birth_date
        - pronouns
        - status
        - student
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type:
            - string
            - 'null'
          maxLength: 100
        preferred_name:
          type:
            - string
            - 'null'
          maxLength: 100
        display_name:
          type: string
          minLength: 1
        email:
          description: |-
            Redacted to `null` for billing staff unless this member receives billing.
          anyOf:
            - type: string
              format: email
              maxLength: 254
            - type: 'null'
        phone:
          description: |-
            Redacted to `null` for billing staff unless this member receives billing.
          type:
            - string
            - 'null'
          maxLength: 40
        birth_date:
          description: Redacted to `null` for billing staff.
          type:
            - string
            - 'null'
          format: date
        pronouns:
          description: Redacted to `null` for billing staff.
          type:
            - string
            - 'null'
          maxLength: 60
        status:
          $ref: '#/components/schemas/PersonStatus'
        student:
          anyOf:
            - $ref: '#/components/schemas/HouseholdStudentProfile'
            - type: 'null'
    HouseholdMember:
      type: object
      additionalProperties: false
      required:
        - id
        - role
        - is_primary_contact
        - receives_billing
        - person
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        role:
          $ref: '#/components/schemas/HouseholdMemberRole'
        is_primary_contact:
          type: boolean
        receives_billing:
          type: boolean
        person:
          $ref: '#/components/schemas/HouseholdPerson'
    GuardianRelationship:
      type: object
      additionalProperties: false
      required:
        - id
        - guardian_person_id
        - student_person_id
        - relationship
        - is_legal_guardian
        - is_emergency_contact
        - is_authorized_pickup
        - portal_permissions
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        guardian_person_id:
          $ref: '#/components/schemas/Ulid'
        student_person_id:
          $ref: '#/components/schemas/Ulid'
        relationship:
          $ref: '#/components/schemas/GuardianRelationshipType'
        is_legal_guardian:
          type: boolean
        is_emergency_contact:
          type: boolean
        is_authorized_pickup:
          type: boolean
        portal_permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PortalPermission'
    HouseholdPermissions:
      type: object
      additionalProperties: false
      required:
        - edit
        - delete
      properties:
        edit:
          type: boolean
          description: True for owners, administrators, and office staff.
        delete:
          type: boolean
          description: True only for studio owners.
    Household:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - notes
        - version
        - members
        - guardian_relationships
        - created_at
        - updated_at
        - permissions
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
          minLength: 1
          maxLength: 160
        notes:
          description: Redacted to `null` for billing staff.
          type:
            - string
            - 'null'
          maxLength: 5000
        version:
          type: integer
          minimum: 1
          description: Aggregate version reserved for optimistic concurrency.
        members:
          type: array
          items:
            $ref: '#/components/schemas/HouseholdMember'
        guardian_relationships:
          description: Returned as an empty array for billing staff.
          type: array
          items:
            $ref: '#/components/schemas/GuardianRelationship'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
        permissions:
          $ref: '#/components/schemas/HouseholdPermissions'
    CreateStudentProfileInput:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/StudentStatus'
        joined_on:
          type:
            - string
            - 'null'
          format: date
        school_grade:
          type:
            - string
            - 'null'
          maxLength: 60
    CreateHouseholdMemberInput:
      type: object
      additionalProperties: false
      description: |-
        A request-local `key` links guardian relationships before persistent ULIDs exist.
        Exactly one member in the aggregate must be the primary contact, and that member
        must have an email address or phone number. Learners require a student profile;
        non-learners cannot have one.
      required:
        - key
        - first_name
        - household_role
        - is_primary_contact
        - receives_billing
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[a-z0-9][a-z0-9-]*$'
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type:
            - string
            - 'null'
          maxLength: 100
        preferred_name:
          type:
            - string
            - 'null'
          maxLength: 100
        email:
          anyOf:
            - type: string
              format: email
              maxLength: 254
            - type: 'null'
        phone:
          type:
            - string
            - 'null'
          maxLength: 40
        birth_date:
          type:
            - string
            - 'null'
          format: date
          description: Must not be later than the request date.
        pronouns:
          type:
            - string
            - 'null'
          maxLength: 60
        household_role:
          $ref: '#/components/schemas/HouseholdMemberRole'
        is_primary_contact:
          type: boolean
        receives_billing:
          type: boolean
        student:
          anyOf:
            - $ref: '#/components/schemas/CreateStudentProfileInput'
            - type: 'null'
    CreateGuardianRelationshipInput:
      type: object
      additionalProperties: false
      description: |-
        Keys must reference a guardian member and a learner member in the same request.
        Each guardian/learner pair may appear only once.
      required:
        - guardian_key
        - student_key
        - relationship
        - is_legal_guardian
        - is_emergency_contact
        - is_authorized_pickup
        - portal_permissions
      properties:
        guardian_key:
          type: string
        student_key:
          type: string
          description: Must differ from `guardian_key`.
        relationship:
