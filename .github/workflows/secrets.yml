name: Secret scan

# Intentionally limited to PR and push events. Gitleaks' maintained action scans
# only the commits introduced by those events. Do not add schedule or manual
# full-history scans here: the imported historical base commit is known to
# contain legacy credentials, while this gate is meant to protect new product
# code and changes. Rotate any historical credential independently of this gate.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Changed commits only
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full ancestry is available so Gitleaks can construct the event's patch,
      # but the action's event range prevents scanning the historical base.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan newly introduced changes
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
